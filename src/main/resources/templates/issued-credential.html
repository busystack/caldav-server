<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Application password created')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main id="main" tabindex="-1">
  <h1>Application password created</h1>
  <p class="notice info">Keep this page open while you configure your app. BusyStack displays the password once.</p>
  <section>
    <h2 th:text="${label}"></h2>
    <p>Expires <time th:replace="~{fragments/layout :: timestamp(${credential.expiresAt}, 'Not recorded')}"></time>.</p>
    <div class="copy-field" data-one-time-secret>
      <div>Application password<br><code id="issued-secret" th:text="${credential.secret}"></code></div>
      <button type="button" class="secondary" data-copy="issued-secret">Copy password</button>
    </div>
  </section>
  <section th:replace="~{fragments/connection :: settings}"></section>
  <section th:replace="~{fragments/connection :: instructions}"></section>
  <p><a class="button" data-one-time-return th:href="${credentialOrigin == 'connect'} ? @{/connections(client=${client},resource=${connectionResourceId})} : @{/security/credentials}">Done</a></p>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
