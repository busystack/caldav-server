<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>New DAV credential</title><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block><h1>New DAV credential</h1><p>Store this secret in your application's credential settings. It is shown only in this response.</p><dl><dt>Username</dt><dd th:text="${credential.username}"></dd><dt>Secret</dt><dd><code id="issued-secret" th:text="${credential.secret}"></code></dd><dt>Expires</dt><dd th:text="${credential.expiresAt}"></dd></dl><button type="button" data-copy="issued-secret">Copy credential</button><p><a th:href="@{/connections}">Continue to connection instructions</a> · <a th:href="@{/security/credentials}">Manage credentials</a></p><p><a th:href="@{/}">Return to your account</a></p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
