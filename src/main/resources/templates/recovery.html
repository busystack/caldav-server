<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recovery · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block><h1>Account recovery</h1><nav th:replace="~{fragments/layout :: securityNav}"></nav><p>Keep recovery codes offline. A code can replace a lost passkey after you recently verify your primary sign-in. It cannot replace your password or upstream sign-in.</p><p>Unused codes: <strong th:text="${status.remaining}"></strong><span th:if="${status.expiresAt != null}"> · expires <time th:replace="~{fragments/layout :: timestamp(${status.expiresAt}, 'Not recorded')}"></time></span>.</p><a class="button" th:href="@{/security/recovery/codes/new}"
    th:text="${status.remaining > 0 ? 'Replace recovery codes' : 'Generate recovery codes'}"></a>
<p><a th:href="@{/security/recovery/use}">Use a saved recovery code</a></p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
