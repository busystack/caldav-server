<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Administration')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block>

<div class="page-heading">
  <h1>Server administration</h1>
  <a class="button" th:href="@{/admin/accounts/new}">Create account</a>
</div>
<section>
  <h2>Accounts and resources</h2>
  <dl>
    <dt>Enabled accounts</dt><dd th:text="${enabledAccounts}"></dd>
    <dt>Disabled accounts</dt><dd th:text="${disabledAccounts}"></dd>
    <dt>Groups</dt><dd th:text="${groups}"></dd>
    <dt>Calendars</dt><dd th:text="${eventCollections}"></dd>
    <dt>Task lists</dt><dd th:text="${taskCollections}"></dd>
    <dt>Journals</dt><dd th:text="${journalCollections}"></dd>
    <dt>Stored UID series</dt><dd th:text="${resources}"></dd>
  </dl>
</section>
<section>
  <h2>Deployment</h2>
  <p th:text="${databaseStatus}"></p>
  <p><span th:text="${serverErrors}"></span> HTTP 5xx responses observed since startup.</p>
  <a th:href="@{/admin/diagnostics}">Open system diagnostics</a>
</section>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
