<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>BusyStack administration</title><link rel="stylesheet" th:href="@{/assets/account.css}"></head><body><main><h1>Administration</h1><p><a th:href="@{/}">Your account</a></p><p><a th:href="@{/admin/oauth-clients}">OAuth client registration</a></p><p><a th:href="@{/admin/diagnostics}">Server diagnostics</a></p><p><a th:href="@{/admin/groups}">Sharing groups</a></p><h2>Accounts</h2><ul><li th:each="account : ${accounts}"><span th:text="${account.username}"></span> · <span th:text="${account.displayName}"></span><span th:if="${account.administrator}"> · administrator</span><span th:unless="${account.enabled}"> · disabled</span><form th:if="${account.enabled}" method="post" th:action="@{/admin/accounts/{id}/disable(id=${account.id})}"><button>Disable account</button></form></li></ul><form method="post" th:action="@{/admin/accounts}"><h2>Provision an account</h2><label>Username <input name="username" required maxlength="64" pattern="[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}"></label><label>Display name <input name="displayName" required maxlength="200"></label><label>Initial password <input name="password" type="password" autocomplete="new-password" minlength="14" maxlength="72" required></label><button>Create account</button></form></main></body></html>
