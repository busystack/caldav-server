<!doctype html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body><section th:fragment="shares"><h2>Individual sharing</h2><p>Only direct grants on collections you own appear here. Removing one does not remove access granted through a group.</p><table><thead><tr><th scope="col">Collection</th><th scope="col">Account</th><th scope="col">Access</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="share:${individualShares.rows}"><td th:text="${share.collectionName}"></td><td><span th:text="${share.username}"></span><span th:unless="${share.enabled}"> (disabled)</span></td><td th:text="${share.permission == 'WRITE' ? 'Read and write' : 'Read only'}"></td><td><form method="post" th:action="@{/shares}"><input type="hidden" name="collection" th:value="${share.collection}"><input type="hidden" name="username" th:value="${share.username}"><input type="hidden" name="permission" value="REVOKE"><button>Remove individual access</button></form></td></tr></tbody></table><p th:if="${individualShares.rows.isEmpty()}">No individual grants on this page.</p><nav aria-label="Individual sharing pages"><a th:if="${individualShares.page > 0}" th:href="@{/(shares-page=${individualShares.page - 1})}">Previous sharing page</a> <a th:if="${individualShares.hasNext}" th:href="@{/(shares-page=${individualShares.page + 1})}">Next sharing page</a></nav></section></body></html>
