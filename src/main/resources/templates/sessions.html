<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessions · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"></head><body><main><h1>Active browser sessions</h1><nav><a th:href="@{/}">Your account</a><a th:href="@{/security/passkeys}">Verify your factors</a></nav><p>Sessions expire after thirty minutes of inactivity. Ending a session requires recent primary and passkey verification. DAV and OAuth access are managed separately.</p><table><caption>Your browser sessions</caption><thead><tr><th scope="col">Created</th><th scope="col">Last used</th><th scope="col">Expires</th><th scope="col">Browser</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="entry : ${sessions}"><td th:text="${entry.createdAt}"></td><td th:text="${entry.lastAccessAt}"></td><td th:text="${entry.expiresAt}"></td><td th:text="${entry.current ? 'This browser' : 'Another browser'}"></td><td><form method="post" th:action="@{/security/sessions/{id}/revoke(id=${entry.id})}"><button>End session</button></form></td></tr></tbody></table></main></body></html>
