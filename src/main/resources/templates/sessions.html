<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sessions · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block><h1>Active browser sessions</h1><nav th:replace="~{fragments/layout :: securityNav}"></nav><p>Sessions expire after thirty minutes of inactivity. Ending a session requires recent primary and passkey verification. DAV and OAuth access are managed separately.</p><div class="table-scroll" tabindex="0" role="region" aria-labelledby="table-caption-1"><table><caption id="table-caption-1">Your browser sessions</caption><thead><tr><th scope="col">Created</th><th scope="col">Last used</th><th scope="col">Expires</th><th scope="col">Browser</th><th scope="col">Action</th></tr></thead><tbody><tr th:each="entry : ${sessions}"><td th:text="${entry.createdAt}"></td><td th:text="${entry.lastAccessAt}"></td><td th:text="${entry.expiresAt}"></td><td th:text="${entry.current ? 'This browser' : 'Another browser'}"></td><td><form method="post" th:action="@{/security/sessions/{id}/revoke(id=${entry.id})}"><button>End session</button></form></td></tr></tbody></table></div></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
