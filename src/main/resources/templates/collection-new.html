<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create a collection')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block>

<a th:href="@{/collections}">Back to collections</a><h1 id="creation-title">Create a resource</h1><p>The resource type stays fixed after creation.</p>
<section><form method="post" data-collection-type data-resource-color th:action="@{/collections}" th:with="formKey=${'collection-create'},activeForm=${formValues != null and errorFormKey == ('collection-create')}"><fieldset th:with="component=${activeForm and formValues.containsKey('component') ? formValues['component'] : (selectedComponent ?: 'VEVENT')}">
  <legend>Resource type</legend>
  <label><input id="collection-create-component" type="radio" name="component" value="VEVENT" th:checked="${component == 'VEVENT'}" required> Calendar — events and appointments</label>
  <label><input type="radio" name="component" value="VTODO" th:checked="${component == 'VTODO'}"> Task list — tasks and to-dos</label>
  <label><input type="radio" name="component" value="VJOURNAL" th:checked="${component == 'VJOURNAL'}"> Journal — journal entries</label>
  <p th:replace="~{fragments/layout :: fieldError('collection-create','component')}"></p>
</fieldset>
<label>Name<input name="name" required maxlength="200" th:id="${formKey + '-name'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('name') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('name') ? formKey + '-name-error' : null}" th:value="${activeForm and formValues.containsKey('name') ? formValues['name'] : ''}"></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('name')}" th:id="${formKey + '-name-error'}" th:text="${fieldErrors['name']}"></p><label>Description (optional)<textarea name="description" maxlength="8000" th:id="${formKey + '-description'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('description') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('description') ? formKey + '-description-error' : null}" th:text="${activeForm and formValues.containsKey('description') ? formValues['description'] : ''}"></textarea></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('description')}" th:id="${formKey + '-description-error'}" th:text="${fieldErrors['description']}"></p><label>Color (optional)<input name="color" placeholder="#08645E"  maxlength="9" th:id="${formKey + '-color'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('color') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('color') ? formKey + '-color-error' : 'color-help'}" th:value="${activeForm and formValues.containsKey('color') ? formValues['color'] : ''}"></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('color')}" th:id="${formKey + '-color-error'}" th:text="${fieldErrors['color']}"></p><p id="color-help">Enter #RRGGBB or #RRGGBBAA. The last two digits specify opacity.</p>
<button class="secondary" type="button" data-color-picker hidden>Choose a color</button>
<input type="color" aria-label="Choose a six-digit color" hidden><button type="submit">Create resource</button></form></section>

</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
