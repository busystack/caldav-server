<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Create a collection')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block>

<a th:href="@{/collections}">Back to collections</a><h1>Create a collection</h1><p>Keep calendars and task lists separate. The type stays fixed after creation.</p>
<section><form method="post" th:action="@{/collections}" th:with="formKey=${'collection-create'},activeForm=${fieldErrors != null and errorFormKey == ('collection-create')}"><label>Name<input name="name" required maxlength="200" th:id="${formKey + '-name'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('name') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('name') ? formKey + '-name-error' : null}" th:value="${activeForm and formValues.containsKey('name') ? formValues['name'] : ''}"></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('name')}" th:id="${formKey + '-name-error'}" th:text="${fieldErrors['name']}"></p><label>Type<select name="component" th:id="${formKey + '-component'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('component') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('component') ? formKey + '-component-error' : null}"><option value="VEVENT" th:selected="${activeForm and formValues.containsKey('component') ? formValues['component'] == 'VEVENT' : false}">Calendar — events</option><option value="VTODO" th:selected="${activeForm and formValues.containsKey('component') ? formValues['component'] == 'VTODO' : false}">Task list — tasks</option></select></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('component')}" th:id="${formKey + '-component-error'}" th:text="${fieldErrors['component']}"></p><label>Description<textarea name="description" maxlength="8000" th:id="${formKey + '-description'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('description') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('description') ? formKey + '-description-error' : null}" th:text="${activeForm and formValues.containsKey('description') ? formValues['description'] : ''}"></textarea></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('description')}" th:id="${formKey + '-description-error'}" th:text="${fieldErrors['description']}"></p><label>Colour (optional)<input name="color" placeholder="#08645E" pattern="#[a-fA-F0-9]{6}([a-fA-F0-9]{2})?" maxlength="9" th:id="${formKey + '-color'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('color') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('color') ? formKey + '-color-error' : 'colour-help'}" th:value="${activeForm and formValues.containsKey('color') ? formValues['color'] : ''}"></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('color')}" th:id="${formKey + '-color-error'}" th:text="${fieldErrors['color']}"></p><p id="colour-help">Use #RRGGBB or #RRGGBBAA. This uses the Apple calendar-color convention; display depends on your client.</p><button>Create collection</button></form></section>

</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
