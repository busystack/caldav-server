<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save recovery codes · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"></head><body><main><h1>Save your recovery codes</h1><p>These codes appear once. Store them securely offline. Each code is single use, expires at <time th:text="${issued.expiresAt}"></time>, and still requires your recent primary sign-in.</p><ol><li th:each="code : ${issued.codes}"><code th:text="${code}"></code></li></ol><p>Generating another set revokes these codes. The server retains only their verifiers.</p><p><a th:href="@{/security/recovery}">Return to recovery settings</a></p></main></body></html>
