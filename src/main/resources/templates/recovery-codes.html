<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Save recovery codes · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block><h1>Save your recovery codes</h1><nav th:replace="~{fragments/layout :: securityNav}"></nav><p>These codes appear once. Store them securely offline. Each code is single use, expires at <time th:replace="~{fragments/layout :: timestamp(${issued.expiresAt}, 'Not recorded')}"></time>, and still requires your recent primary sign-in.</p><ol><li th:each="code : ${issued.codes}"><code th:text="${code}"></code></li></ol><p>Generating another set revokes these codes. The server retains only their verifiers.</p><p><a th:href="@{/security/recovery}">Return to recovery settings</a></p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
