<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Request could not complete')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block>

<h1 th:text="${errorTitle}">The request could not complete</h1><p class="notice error" role="alert" th:text="${message}"></p><p th:if="${requestReference != null}">Request reference <code th:text="${requestReference}"></code></p>
<div class="actions">
  <a th:if="${retryPath != null and applicationShell == true}" class="button" th:href="@{${retryPath}}">Return to this workflow</a>
  <a th:if="${applicationShell == true}" th:href="@{/}">Open Overview</a>
  <a th:unless="${applicationShell == true}" th:href="@{/login}">Open sign-in</a>
</div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
