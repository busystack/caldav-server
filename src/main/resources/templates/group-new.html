<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Create group')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main id="main" tabindex="-1">
  <a th:href="@{/admin/groups}">Back to groups</a>
  <h1>Create group</h1>
  <p>Group membership lets resource owners share access with many accounts at once.</p>
  <th:block th:replace="~{fragments/layout :: feedback}"></th:block>
<form method="post" th:action="@{/admin/groups}" th:with="formKey=${'group-create'},activeForm=${formValues != null and errorFormKey == ('group-create')}"><input type="hidden" name="returnCollection" th:value="${returnCollection}"><label>Group name<input name="name" required maxlength="200" th:id="${formKey + '-name'}" th:attr="aria-invalid=${activeForm and fieldErrors.containsKey('name') ? 'true' : null},aria-describedby=${activeForm and fieldErrors.containsKey('name') ? formKey + '-name-error' : null}" th:value="${activeForm and formValues.containsKey('name') ? formValues['name'] : ''}"></label><p class="field-error" th:if="${activeForm and fieldErrors.containsKey('name')}" th:id="${formKey + '-name-error'}" th:text="${fieldErrors['name']}"></p><button>Create group</button></form>

</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
