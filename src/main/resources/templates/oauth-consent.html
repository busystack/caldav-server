<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Authorize application · BusyStack</title><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head><body><header th:replace="~{fragments/layout :: header}"></header><main id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block><h1>Authorize application</h1><p><strong th:text="${clientName}"></strong> requests access to your calendars and tasks. Your collection permissions apply to every request.</p><form method="post" th:action="@{/oauth2/authorize}"><input type="hidden" name="client_id" th:value="${clientId}"><input type="hidden" name="state" th:value="${state}"><label><input type="checkbox" name="scope" value="dav" checked> Calendar and task access</label><button>Authorize application</button></form><form method="post" th:action="@{/oauth2/authorize}"><input type="hidden" name="client_id" th:value="${clientId}"><input type="hidden" name="state" th:value="${state}"><button>Deny access</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
