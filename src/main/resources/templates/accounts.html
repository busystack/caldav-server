<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Accounts')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main"><th:block th:replace="~{fragments/layout :: feedback}"></th:block>

<div class="page-heading"><div><span class="eyebrow">Server administration</span><h1>Accounts</h1><p>Provision ordinary users and maintain profiles. Administration does not grant access to private calendar contents.</p></div><a class="button" th:href="@{/admin/accounts/new}">Create account</a></div>
<form method="get" th:action="@{/admin/accounts}" class="filters"><label>Search accounts<input name="q" th:value="${query}" maxlength="200"></label><label>Status<select name="status"><option th:each="s : ${ {'all','enabled','disabled','local','external'} }" th:value="${s}" th:text="${#strings.capitalize(s)}" th:selected="${s == filter}"></option></select></label><button>Search accounts</button></form>
<section><p class="empty" th:if="${accountPage.rows.isEmpty()}">No accounts match these filters.</p><div class="table-scroll" th:unless="${accountPage.rows.isEmpty()}" tabindex="0" role="region" aria-labelledby="table-caption-1"><table><caption id="table-caption-1">Account directory — 50 per page</caption><thead><tr><th scope="col">Account</th><th scope="col">Display name</th><th scope="col">Identity</th><th scope="col">Status</th><th scope="col">Role</th></tr></thead><tbody><tr th:each="a : ${accountPage.rows}"><td><a th:href="@{/admin/accounts/{id}(id=${a.id})}" th:text="${a.username}"></a></td><td th:text="${a.displayName}"></td><td th:text="${a.external ? 'Organization-managed' : 'Local'}"></td><td th:text="${a.enabled ? 'Enabled' : 'Disabled'}"></td><td th:text="${a.administrator ? 'Administrator' : 'Ordinary user'}"></td></tr></tbody></table></div></section><nav th:replace="~{fragments/layout :: pagination('/admin/accounts',${accountPage})}"></nav>

</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
