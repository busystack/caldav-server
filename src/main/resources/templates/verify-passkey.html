<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · BusyStack</title>
<meta name="csrf-token" th:content="${_csrf.token}"><meta name="csrf-header" th:content="${_csrf.headerName}">
<script th:src="@{/assets/security.js}" defer></script><link rel="stylesheet" th:href="@{/assets/account.css}"><script th:src="@{/assets/portal.js}" defer></script></head>
<body><header th:replace="~{fragments/layout :: header}"></header><main tabindex="-1" id="main" class="auth-page">
<h1>Verify your passkey</h1><p th:if="${viewer != null}">Continue as <strong th:text="${viewer.username}"></strong>.</p><p>Use a passkey saved for this BusyStack account. Follow the prompt from your browser or password manager.</p><button type="button" id="authenticate-passkey" th:attr="data-context=@{/}">Verify passkey</button>
<p>Lost access to your passkey? <a th:href="@{/security/recovery}">Use a saved recovery code</a> after primary sign-in, or contact your operator.</p>
<p id="security-status" role="status" aria-live="polite"></p></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
